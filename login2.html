<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja Huancayo - Bienvenido Colaborador</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/login2.css">
</head>
<body>

  <div class="container-fluid min-vh-100 p-0">
    <div class="row g-0 min-vh-100">
      
      <!-- ==========================================
           COLUMNA IZQUIERDA: IMAGEN DE LA CIUDAD
           ========================================== -->
      <div class="col-lg-6 d-none d-lg-block city-side-container">
        <!-- Reemplaza "ciudad-huancayo.jpg" con el nombre exacto de tu imagen -->
        <img src="img/fondoExterno.jpg" alt="Plaza Constitución Huancayo">
      </div>

      <!-- ==========================================
           COLUMNA DERECHA: FORMULARIO DE ACCESO
           ========================================== -->
      <div class="col-lg-6 col-12 d-flex align-items-center justify-content-center p-4">
        <div class="login-wrapper">

          <form action="#" method="POST">

            <!-- ALERTA DE ERROR (Activa por CSS si los datos no coinciden) -->
            <div class="alert-feedback alert-error" role="alert">
              <i class="bi bi-x-circle-fill fs-5"></i>
              <span>Error: Información no aceptada o datos incorrectos.</span>
            </div>

            <!-- ALERTA DE ÉXITO (Activa por CSS cuando todo coincide) -->
            <div class="alert-feedback alert-success" role="alert">
              <i class="bi bi-check-circle-fill fs-5"></i>
              <span>¡Aceptado! Credenciales válidas y verificadas.</span>
            </div>
            
            <!-- LOGO CAJA HUANCAYO -->
            <div class="text-center mb-4">
              <!-- Reemplaza "logo-caja-huancayo.png" con el nombre de tu archivo de logo -->
              <img src="img/logoRed.svg" alt="Caja Huancayo" class="brand-logo-img mb-3">
              <h4 class="fw-bold mb-1 text-dark">Bienvenido Colaborador</h4>
              <p class="text-muted small">Ingrese sus credenciales</p>
            </div>

            <!-- CAMPO USUARIO -->
            <!-- pattern="hg": valida que el usuario sea exactamente 'hg' -->
            <div class="input-box mb-3">
              <div class="w-100">
                <label for="usuario">Usuario</label>
                <input 
                  type="text" 
                  id="usuario" 
                  name="usuario" 
                  pattern="hg" 
                  required 
                  placeholder="hg"
                  title="El usuario debe ser exacto (ej. hg)"
                >
              </div>
              <span class="input-box-icon">
                <i class="bi bi-person"></i>
              </span>
            </div>

            <!-- CAMPO CONTRASEÑA -->
            <!-- pattern=".{6,}": valida un mínimo de 6 caracteres -->
            <div class="input-box mb-3">
              <div class="w-100">
                <label for="clave">Contraseña</label>
                <input 
                  type="password" 
                  id="clave" 
                  name="clave" 
                  pattern=".{6,}" 
                  required 
                  placeholder="••••••••"
                  title="La contraseña debe tener al menos 6 caracteres"
                >
              </div>
              <span class="input-box-icon">
                <i class="bi bi-eye-slash"></i>
              </span>
            </div>

            <!-- SWITCH RECORDAR Y ENLACE OLVIDÓ CREDENCIALES -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" id="rememberUser">
                <label class="form-check-label small text-muted ms-1" for="rememberUser">Recordar usuario</label>
              </div>
              <a href="#" class="link-credentials">¿Olvidó sus credenciales?</a>
            </div>

            <!-- CHECKBOX RECAPTCHA -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="captcha" required>
              <label class="form-check-label small text-dark" for="captcha">
                No soy un robot
              </label>
            </div>

            <!-- BOTÓN INGRESAR -->
            <div class="d-grid">
              <button type="submit" class="btn btn-login">Ingresar</button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
