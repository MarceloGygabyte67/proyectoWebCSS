<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- LIBRERIA DE FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FRAMEWORK DE BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- LIBRERIA DE ICONOS -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>

    <!-- HOJA DE ESTILOS-->
    <link rel="stylesheet" href="css/contacto.css">

    <script src="js/WE_MC_03_jquery.js"></script>
    <div class="contact-container">
<!-- Columna Izquierda: Información -->
<div class="contact-info">
<h2 class="info-title">Vamos a ponernos en contacto con

nosotros</h2>

<ul class="info-list">
<li>
<i class="fa-regular fa-envelope"></i>
<span>ramirezolamarcelo546@gmail.com</span>
</li>
<li>
<i class="fa-solid fa-map-location-dot"></i>
<span>Marcelo Ramirez</span>
</li>
<li>
<i class="fa-solid fa-phone-volume"></i>
<span>+51 906 648 078</span>
</li>
</ul>
<div class="social-section">
    <p>Conéctate conmigo:</p>
<div class="social-icons">

<a href="#"><i class="fa-brands fa-facebook"></i></a>
<a href="#"><i class="fa-brands fa-youtube"></i></a>
<a href="#"><i class="fa-brands fa-twitter"></i></a>
<a href="#"><i class="fa-brands fa-instagram"></i></a>

</div>
</div>
<!-- Círculo decorativo inferior -->
<div class="circle-decoration"></div>
</div>
<!-- Columna Derecha: Formulario -->
<div class="contact-form">
<h2 class="form-title">Contacta con nosotros</h2>
<form action="#" method="POST">
<!-- Se usa fieldset y legend para lograr el efecto de la

línea cortada por el texto sin usar fondos sólidos -->
<fieldset class="input-group">
<legend>Usuario</legend>
<input type="text" name="username" required>
</fieldset>
<fieldset class="input-group">
<legend>Email</legend>
<input type="email" name="email" required>
</fieldset>
<fieldset class="input-group">
<legend>Celular</legend>
<input type="tel" name="phone" required>
</fieldset>
<fieldset class="input-group textarea-group">
<legend>Mensaje</legend>
<textarea name="message" required></textarea>
</fieldset>
<button type="submit" class="btn-send">Enviar</button>
</form>
</div>
</div>
    
</body>
</html>
